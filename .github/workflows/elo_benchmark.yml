name: Elo Benchmark

on: [pull_request]

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake \
            qt6-base-dev qt6-svg-dev qt6-base-dev-tools qt6-5compat-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            m4 \

      - name: Build cutechess-cli
        run: |
          git clone --depth 1 https://github.com/cutechess/cutechess.git
          cmake -S cutechess -B cutechess/build -DWITH_TESTS=OFF
          cmake --build cutechess/build --target cli -j"$(nproc)"

      - name: Build PR version
        run: |
          mkdir -p m4
          autoreconf --install
          ./configure
          make -j"$(nproc)"
          cp src/engine engine-pr

      - name: Build base version
        run: |
          git checkout ${{ github.base_ref }}
          mkdir -p m4
          autoreconf --install
          ./configure
          make -j"$(nproc)"
          cp src/engine engine-base

      - name: Run match
        run: |
          CUTECHESS_CLI="$(find cutechess/build -type f -name cutechess-cli -executable | head -n 1)"
          "$CUTECHESS_CLI" \
            -engine cmd=./engine-pr name=PR \
            -engine cmd=./engine-base name=Base \
            -each proto=uci tc=10+0.1 \
            -rounds 200 -concurrency 2 \
            -pgnout results.pgn | tee match.txt

      - name: Post result as comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('match.txt', 'utf8');
            const elo = result.match(/Elo difference.*$/m)?.[0] ?? 'Could not parse Elo';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Elo Benchmark\n\`\`\`\n${elo}\n\`\`\``
            })
